parameters:
- name: dotnetVersion
  type: string
  default: '10.x'
  displayName: 'Version of .NET SDK to install'

- name: targetPath
  type: string
  default: '$(Build.SourcesDirectory)'
  displayName: 'Path to the .NET project to scan. .csproj, .slnx, .sln. packages.config files are supported'

- name: cyclonedxVersion
  type: string
  default: '6.2.0'
  displayName: 'Version of CycloneDX.Tool to install'

- name: outputArtifactName
  type: string
  default: 'SBOM'
  displayName: 'Name of the SBOM artifact to publish'

- name: componentVersion
  type: string
  default: ''
  displayName: 'Version of the component being scanned'

- name: cycloneDxSpecVersion
  type: string
  default: '1.6'
  displayName: 'Version of CycloneDX specification to use for the SBOM'

- name: componentName
  type: string
  default: ''

- name: metadataPath
  type: string
  default: ''
  displayName: 'Path to a JSON file containing metadata to include in the SBOM'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: ${{ parameters.dotnetVersion }}
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - task: DotNetCoreCLI@2
    displayName: 'Restore .NET Dependencies'
    inputs:
      command: 'restore'
      projects: ${{ parameters.targetPath }}
  
  - task: PowerShell@2
    displayName: Install Cyclonedx-dotnet
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        dotnet tool install --global CycloneDX.Tool --version ${{ parameters.cyclonedxVersion }}

  - task: PowerShell@2
    displayName: 'Generate SBOM'
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        $commandArgs = @(
            "dotnet-cyclonedx",
            "-o", "$(Build.ArtifactStagingDirectory)",
            "-f", "sbom.cdx.json",
            "--output-format", "json",
            "-p", "${{ parameters.targetPath }}",
            "--spec-version", "${{ parameters.cycloneDxSpecVersion }}"
        )

        if (${{ parameters.componentVersion }} -ne "") {
            $commandArgs += "--set-version"
            $commandArgs += "${{ parameters.componentVersion }}"
        }

        if (${{ parameters.componentName }} -ne "") {
            $commandArgs += "--set-name"
            $commandArgs += "${{ parameters.componentName }}"
        }

        if (${{ parameters.metadataPath }} -ne "") {
            $commandArgs += "--import-metadata-path"
            $commandArgs += "${{ parameters.metadataPath }}"
        }

        Write-Host "Running command with arguments: $commandArgs"

        & $commandArgs

  - task: PublishPipelineArtifact@1
    displayName: 'Publish SBOM Artifact'
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/sbom.cdx.json"
      artifactName: ${{ parameters.outputArtifactName }}